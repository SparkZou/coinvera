# Host nginx site for the demo server (223.165.71.59).
# Terminates TLS for coinvera.aicloud.co.nz and proxies to the app container
# published on 127.0.0.1:8090. Certificates are issued by certbot (webroot).

server {
    listen 80;
    listen [::]:80;
    server_name coinvera.aicloud.co.nz;

    # ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name coinvera.aicloud.co.nz;

    ssl_certificate     /etc/letsencrypt/live/coinvera.aicloud.co.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coinvera.aicloud.co.nz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
